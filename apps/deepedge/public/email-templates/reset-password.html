<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body style="margin:0;padding:0;background-color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:480px;background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:32px;text-align:center;">
                <h1 style="margin:0 0 8px;font-size:20px;color:#111827;">Reset your password</h1>
                <p style="margin:0 0 24px;font-size:14px;color:#6b7280;">
                  Enter this code to choose a new password.
                </p>
                <div style="display:inline-block;padding:16px 24px;background:#f3f4f6;border-radius:8px;font-size:32px;font-weight:700;letter-spacing:0.3em;color:#111827;">
                  {{ .Token }}
                </div>
                <p style="margin:24px 0 0;font-size:12px;color:#9ca3af;">
                  This code expires shortly. If you didn't request a password reset, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
